<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic & Polynomial Mindmap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Changed from center to space-evenly to pull title down and center chart */
            justify-content: space-evenly; 
            padding: 20px;
            overflow: hidden;
        }
        
        header {
            text-align: center;
            padding-top: 10px;
            z-index: 10;
        }
        
        h1 {
            color: #f0fdf4;
            font-size: clamp(1.8em, 5vw, 2.6em);
            margin-bottom: 8px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #86efac;
            font-size: clamp(0.85em, 1.8vw, 1.05em);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }
        
        .mindmap-container {
            position: relative;
            /* Balanced size to prevent title crowding */
            width: 88vmin; 
            height: 88vmin;
            max-width: 820px;
            max-height: 820px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.6));
        }
        
        .tooltip {
            position: fixed;
            background: rgba(6, 30, 24, 0.98);
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            border: 1px solid rgba(134, 239, 172, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            max-width: 300px;
            line-height: 1.5;
        }
        
        .tooltip.show { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <h1>Quadratic & Polynomials</h1>
        <p class="subtitle">Exploring Roots, Discriminants, and Functional Transformations</p>
    </header>

    <div class="mindmap-container">
        <canvas id="mindmapCanvas"></canvas>
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script>
        const canvas = document.getElementById('mindmapCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        
        const apps = [
            { name: "Discriminant MCQ", url: "https://discriminat-quadratic.vercel.app/", color: "#10b981", desc: "Interactive questions on the nature of roots using Δ = b² - 4ac." },
            { name: "Linear to Quadratic", url: "https://linear-to-quadratic.vercel.app/", color: "#22c55e", desc: "Visualizing the transition from first to second-degree equations." },
            { name: "Hyperbola & Quadratic", url: "https://hyperbola-quadratic.vercel.app/", color: "#16a34a", desc: "The relationship between quadratic forms and reciprocal functions." },
            { name: "Polynomial Intro", url: "https://simultaneous-polynomial.vercel.app/", color: "#15803d", desc: "Introduction to higher-order polynomials and simultaneous solving." },
            { name: "Vieta's Formulas", url: "https://why-factorise-quadratic-with-vietas.vercel.app/", color: "#166534", desc: "Why we factorise: exploring the sum and product of roots." },
            { name: "Pre-Vieta Logic", url: "https://why-factorise-quadratics-pre-vieta.vercel.app/", color: "#14532d", desc: "Conceptual foundations before formalising Vieta's relationships." },
            { name: "Completing Square 1", url: "https://completing-the-square.vercel.app/", color: "#065f46", desc: "Geometric and algebraic guide to the square-completion method." },
            { name: "Completing Square 2", url: "https://complete-squarea-1.vercel.app/#/2", color: "#064e3b", desc: "Advanced practice and visual models for a=1 and a≠1." },
            { name: "Root Analysis", url: "https://leelemacjames.github.io/quadraticDiscriminant/", color: "#059669", desc: "Comprehensive dashboard for quadratic discriminant behavior." }
        ];

        let hoveredSlice = -1;
        let hoveredCenter = false;

        function initCanvas() {
            const container = document.querySelector('.mindmap-container');
            const size = Math.min(container.offsetWidth, container.offsetHeight);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);
        }

        function drawMindmap() {
            const size = canvas.width / (window.devicePixelRatio || 1);
            const centerX = size / 2;
            const centerY = size / 2;
            
            const outerRadius = size * 0.43; // Slightly reduced to ensure text safety
            const innerRadius = size * 0.13; 
            
            ctx.clearRect(0, 0, size, size);
            const sliceAngle = (Math.PI * 2) / apps.length;
            
            apps.forEach((app, i) => {
                const angleMid = i * sliceAngle - Math.PI / 2 + sliceAngle / 2;
                const startAngle = i * sliceAngle - Math.PI / 2;
                const endAngle = startAngle + sliceAngle;
                const isHovered = hoveredSlice === i;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                const currentRadius = isHovered ? outerRadius + 8 : outerRadius;
                ctx.arc(centerX, centerY, currentRadius, startAngle, endAngle);
                ctx.closePath();
                
                ctx.fillStyle = app.color;
                ctx.globalAlpha = isHovered ? 1.0 : 0.8;
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angleMid);
                
                const normAngle = ((angleMid + Math.PI / 2) % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);
                const isLeftSide = (normAngle > Math.PI && normAngle < Math.PI * 2);

                ctx.fillStyle = "white";
                const fontSize = Math.max(10, Math.floor(size / 52));
                ctx.font = isHovered ? `bold ${fontSize + 1}px Segoe UI` : `${fontSize}px Segoe UI`;

                if (isLeftSide) {
                    ctx.rotate(Math.PI);
                    ctx.textAlign = "left";
                    ctx.fillText(app.name, -outerRadius + 18, fontSize / 3);
                } else {
                    ctx.textAlign = "right";
                    ctx.fillText(app.name, outerRadius - 18, fontSize / 3);
                }
                
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
            ctx.fillStyle = hoveredCenter ? '#ffffff' : '#042f2e';
            ctx.fill();
            ctx.strokeStyle = 'rgba(134, 239, 172, 0.9)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = hoveredCenter ? '#064e3b' : '#86efac';
            ctx.textAlign = 'center';
            const centerFontSize = Math.max(11, Math.floor(size / 50));
            ctx.font = `bold ${centerFontSize}px Segoe UI`;
            ctx.fillText('QUADRATIC', centerX, centerY - (centerFontSize / 6));
            ctx.font = `${centerFontSize * 0.75}px Segoe UI`;
            ctx.fillText('ALGEBRA', centerX, centerY + (centerFontSize * 0.85));
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (evt.clientX - rect.left) * (canvas.width / (window.devicePixelRatio || 1) / rect.width),
                y: (evt.clientY - rect.top) * (canvas.height / (window.devicePixelRatio || 1) / rect.height)
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            const size = canvas.width / (window.devicePixelRatio || 1);
            const centerX = size / 2;
            const centerY = size / 2;
            
            const dx = pos.x - centerX;
            const dy = pos.y - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const innerRadius = size * 0.13;
            const outerRadius = size * 0.43;

            if (dist < innerRadius) {
                hoveredCenter = true;
                hoveredSlice = -1;
                tooltip.classList.remove('show');
                canvas.style.cursor = 'pointer';
            } else if (dist < outerRadius + 10) {
                hoveredCenter = false;
                let angle = Math.atan2(dy, dx) + Math.PI / 2;
                if (angle < 0) angle += Math.PI * 2;
                hoveredSlice = Math.floor(angle / ((Math.PI * 2) / apps.length));
                
                const app = apps[hoveredSlice];
                tooltip.innerHTML = `<strong>${app.name}</strong><br>${app.desc}`;
                tooltip.style.left = (e.clientX + 20) + 'px';
                tooltip.style.top = (e.clientY + 20) + 'px';
                tooltip.classList.add('show');
                canvas.style.cursor = 'pointer';
            } else {
                hoveredSlice = -1;
                hoveredCenter = false;
                tooltip.classList.remove('show');
                canvas.style.cursor = 'default';
            }
            drawMindmap();
        });

        canvas.addEventListener('click', () => {
            if (hoveredSlice !== -1) {
                window.open(apps[hoveredSlice].url, '_blank');
            } else if (hoveredCenter) {
                window.open('https://cbtralquadratichub.netlify.app/', '_blank');
            }
        });

        window.addEventListener('resize', () => {
            initCanvas();
            drawMindmap();
        });
        
        initCanvas();
        drawMindmap();
    </script>
</body>
</html>
